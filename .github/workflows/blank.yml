name: Launch Google with UiPath Linux Robot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ROBOT_TAG: "latest26.10"      # set to a tag you know works (e.g. latest24.10) to skip the search
  UIPATH_HOST: https://staging.uipath.com
  ORCH_URL: https://staging.uipath.com/uipatransbfh/BalaTenant/orchestrator_
  PROCESS_NAME: Linux_Unattended_Automation
  FOLDER_ID: "827724"
  ROBOT_ACCOUNT: "robo"         # robot account the job must run as
  MACHINE_NAME: "Linux_Robot"   # machine template the container connects with
  # Secrets: add these in Settings > Secrets and variables > Actions
  UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
  UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
  API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
  API_CLIENT_SECRET: ${{ secrets.API_CLIENT_SECRET }}

jobs:
  run-robot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start UiPath Linux robot
        run: |
          IMAGE=""
          if [ -n "$ROBOT_TAG" ]; then TAGS="$ROBOT_TAG"; else TAGS="latest26.10 latest25.10 latest24.10"; fi
          for TAG in $TAGS; do
            for BASE in uipathprod.azurecr.io/robot/uiautomation-runtime registry.uipath.com/robot/uiautomation-runtime; do
              REF="$BASE:$TAG"
              echo "Trying $REF"
              if docker pull "$REF"; then IMAGE="$REF"; break 2; fi
            done
          done
          [ -n "$IMAGE" ] || { echo "Could not pull the robot image with any tag/registry"; exit 1; }
          echo "Using image $IMAGE"

          docker run -e LICENSE_AGREEMENT=accept \
            -e ORCHESTRATOR_URL="$ORCH_URL" \
            -e CLIENT_ID="$UIPATH_CLIENT_ID" \
            -e CLIENT_SECRET="$UIPATH_CLIENT_SECRET" \
            -d --name uipath-robot "$IMAGE"
          sleep 30
          docker logs uipath-robot | tail -n 30

      - name: Create screenshots folder in robot container
        run: |
          docker exec -u 1000 uipath-robot mkdir -p /home/robotuser/screenshots
          docker exec uipath-robot ls -ld /home/robotuser/screenshots

      - name: Start the process in Orchestrator (as robot account)
        run: |
          TOKEN=$(curl -s -X POST "$UIPATH_HOST/identity_/connect/token" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$API_CLIENT_ID" \
            --data-urlencode "client_secret=$API_CLIENT_SECRET" \
            --data-urlencode "scope=OR.Jobs OR.Execution OR.Folders OR.Users.Read OR.Machines.Read" | jq -r .access_token)
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "Token request failed"; exit 1; }

          RELEASE_KEY=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "X-UIPATH-OrganizationUnitId: $FOLDER_ID" \
            "$ORCH_URL/odata/Releases?\$filter=Name%20eq%20'$PROCESS_NAME'" | jq -r '.value[0].Key')
          [ -n "$RELEASE_KEY" ] && [ "$RELEASE_KEY" != "null" ] || { echo "Process not found in folder"; exit 1; }

          # --- Resolve the robot account and the connected machine session ---
          ROBOT_ID=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "X-UIPATH-OrganizationUnitId: $FOLDER_ID" \
            "$ORCH_URL/odata/Users?\$filter=UserName%20eq%20'$ROBOT_ACCOUNT'&\$expand=UnattendedRobot" \
            | jq -r '.value[0].UnattendedRobot.RobotId')
          [ -n "$ROBOT_ID" ] && [ "$ROBOT_ID" != "null" ] || { echo "Robot account '$ROBOT_ACCOUNT' not found (check name, folder assignment, OR.Users.Read scope)"; exit 1; }

          TEMPLATE_ID=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "X-UIPATH-OrganizationUnitId: $FOLDER_ID" \
            "$ORCH_URL/odata/Machines?\$filter=Name%20eq%20'$MACHINE_NAME'" | jq -r '.value[0].Id')
          [ -n "$TEMPLATE_ID" ] && [ "$TEMPLATE_ID" != "null" ] || { echo "Machine '$MACHINE_NAME' not found (check name, OR.Machines.Read scope)"; exit 1; }

          SESSIONS=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "X-UIPATH-OrganizationUnitId: $FOLDER_ID" \
            "$ORCH_URL/odata/Sessions/UiPath.Server.Configuration.OData.GetMachineSessions(key=$TEMPLATE_ID)")
          echo "$SESSIONS" | jq -c '.value[]? | {SessionId, Id, IsConnected, HostMachineName}'
          # prefer a connected session; fall back to the last one listed
          SESSION_ID=$(echo "$SESSIONS" | jq -r '([.value[]? | select(.IsConnected == true)][0] // .value[-1]) | (.SessionId // .Id)')
          [ -n "$SESSION_ID" ] && [ "$SESSION_ID" != "null" ] || { echo "No machine session found for '$MACHINE_NAME'"; exit 1; }
          echo "Robot account=$ROBOT_ACCOUNT RobotId=$ROBOT_ID Machine=$MACHINE_NAME TemplateId=$TEMPLATE_ID SessionId=$SESSION_ID"

          # --- Start the job on that robot + machine ---
          START_RESP=$(curl -s -X POST -H "Authorization: Bearer $TOKEN" \
            -H "X-UIPATH-OrganizationUnitId: $FOLDER_ID" \
            -H "Content-Type: application/json" \
            "$ORCH_URL/odata/Jobs/UiPath.Server.Configuration.OData.StartJobs" \
            -d "{\"startInfo\":{\"ReleaseKey\":\"$RELEASE_KEY\",\"RobotIds\":[$ROBOT_ID],\"MachineSessionIds\":[$SESSION_ID],\"JobsCount\":1,\"Strategy\":\"ModernJobsCount\",\"RuntimeType\":\"Unattended\",\"InputArguments\":\"{}\"}}")
          JOB_KEY=$(echo "$START_RESP" | jq -r '.value[0].Key')
          [ -n "$JOB_KEY" ] && [ "$JOB_KEY" != "null" ] || { echo "StartJobs failed: $START_RESP"; exit 1; }
          echo "Started job $JOB_KEY"

          for i in $(seq 1 40); do
            STATE=$(curl -s -H "Authorization: Bearer $TOKEN" \
              -H "X-UIPATH-OrganizationUnitId: $FOLDER_ID" \
              "$ORCH_URL/odata/Jobs?\$filter=Key%20eq%20$JOB_KEY" | jq -r '.value[0].State')
            echo "State: $STATE"
            case "$STATE" in
              Successful) exit 0 ;;
              Faulted|Stopped) exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for job"; exit 1

      - name: Debug - check container output
        if: always()
        run: |
          echo "--- screenshots folder ---"
          docker exec uipath-robot ls -la /home/robotuser/screenshots || true
          echo "--- PNG files created in the last 30 minutes ---"
          docker exec uipath-robot sh -c 'find / -name "*.png" -mmin -30 -not -path "/proc/*" -not -path "/usr/*" 2>/dev/null' || true
          echo "--- robot logs in container ---"
          docker exec uipath-robot sh -c 'ls -la /home/robotuser/.local/share/UiPath/Logs; grep -rih "screenshot\|Linux_Unattended_Automation" /home/robotuser/.local/share/UiPath/Logs | tail -n 30' || true

      - name: Collect robot logs and clean up
        if: always()
        run: |
          mkdir -p robot-logs screenshots

          # Robot logs
          docker cp uipath-robot:/home/robotuser/.local/share/UiPath/Logs/. ./robot-logs/ || true

          # Screenshots saved in /home/robotuser/screenshots (the "/." copies the folder's contents)
          docker cp uipath-robot:/home/robotuser/screenshots/. ./screenshots/ || true

          # Fallback: any PNGs the robot saved in /tmp
          for f in $(docker exec uipath-robot sh -c 'ls /tmp/*.png 2>/dev/null'); do
            docker cp "uipath-robot:$f" ./screenshots/ || true
          done

          docker stop uipath-robot || true
          docker rm uipath-robot || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-output
          path: |
            robot-logs/
            screenshots/
          if-no-files-found: warn
