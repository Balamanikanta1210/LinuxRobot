name: Launch Google with UiPath Linux Robot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ROBOT_TAG: ""   # set to a tag you know works (e.g. latest24.10) to skip the search
  UIPATH_HOST: https://staging.uipath.com
  ORCH_URL: https://staging.uipath.com/uipatransbfh/BalaTenant/orchestrator_
  PROCESS_NAME: Linux_Unattended_Automation
  FOLDER_ID: "827724"
  UIPATH_CLIENT_ID: '93ca7869-024e-4637-b444-23a0f8a1877e'
  UIPATH_CLIENT_SECRET: '3DnLwd59N7VWLK62'
  API_CLIENT_ID: '7664bfd0-0cc6-44c1-8347-2a786a016564'
  API_CLIENT_SECRET: '9*tzjmFVXBZjZr9%R1Fyq7qtyO6EdApDgNVqDdlUzV20nK?5_Yz~*yt)UlZLn29p'

jobs:
  run-robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start UiPath Linux robot
        run: |
          IMAGE=""
          if [ -n "$ROBOT_TAG" ]; then TAGS="$ROBOT_TAG"; else TAGS="latest26.10 latest25.10 latest24.10"; fi
          for TAG in $TAGS; do
            for BASE in uipathprod.azurecr.io/robot/uiautomation-runtime registry.uipath.com/robot/uiautomation-runtime; do
              REF="$BASE:$TAG"
              echo "Trying $REF"
              if docker pull "$REF"; then IMAGE="$REF"; break 2; fi
            done
          done
          [ -n "$IMAGE" ] || { echo "Could not pull the robot image with any tag/registry"; exit 1; }
          echo "Using image $IMAGE"

          docker run -e LICENSE_AGREEMENT=accept \
            -e ORCHESTRATOR_URL="$ORCH_URL" \
            -e CLIENT_ID="$UIPATH_CLIENT_ID" \
            -e CLIENT_SECRET="$UIPATH_CLIENT_SECRET" \
            -d --name uipath-robot "$IMAGE"
          sleep 30
          docker logs uipath-robot | tail -n 30

      - name: Start the process in Orchestrator
        run: |
          TOKEN=$(curl -s -X POST "$UIPATH_HOST/identity_/connect/token" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$API_CLIENT_ID" \
            --data-urlencode "client_secret=$API_CLIENT_SECRET" \
            --data-urlencode "scope=OR.Jobs OR.Execution OR.Folders" | jq -r .access_token)
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "Token request failed"; exit 1; }

          RELEASE_KEY=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "X-UIPATH-OrganizationUnitId: $FOLDER_ID" \
            "$ORCH_URL/odata/Releases?\$filter=Name%20eq%20'$PROCESS_NAME'" | jq -r '.value[0].Key')
          [ -n "$RELEASE_KEY" ] && [ "$RELEASE_KEY" != "null" ] || { echo "Process not found in folder"; exit 1; }

          JOB_KEY=$(curl -s -X POST -H "Authorization: Bearer $TOKEN" \
            -H "X-UIPATH-OrganizationUnitId: $FOLDER_ID" \
            -H "Content-Type: application/json" \
            "$ORCH_URL/odata/Jobs/UiPath.Server.Configuration.OData.StartJobs" \
            -d "{\"startInfo\":{\"ReleaseKey\":\"$RELEASE_KEY\",\"Strategy\":\"ModernJobsCount\",\"JobsCount\":1}}" \
            | jq -r '.value[0].Key')
          echo "Started job $JOB_KEY"

          for i in $(seq 1 40); do
            STATE=$(curl -s -H "Authorization: Bearer $TOKEN" \
              -H "X-UIPATH-OrganizationUnitId: $FOLDER_ID" \
              "$ORCH_URL/odata/Jobs?\$filter=Key%20eq%20$JOB_KEY" | jq -r '.value[0].State')
            echo "State: $STATE"
            case "$STATE" in
              Successful) exit 0 ;;
              Faulted|Stopped) exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for job"; exit 1
          
      - name: Debug - find screenshots in container
        if: always()
        run: |
          echo "--- PNG files anywhere in the container ---"
          docker exec uipath-robot sh -c 'find / -name "*.png" -mmin -30 -not -path "/proc/*" -not -path "/usr/*" 2>/dev/null' || true
          echo "--- screenshots folder ---"
          docker exec uipath-robot ls -la /home/robotuser/screenshots || true
          echo "--- working directory ---"
          docker exec uipath-robot sh -c 'pwd; ls -la' || true          

      - name: Collect robot logs and clean up
        if: always()
        run: |
          mkdir -p robot-logs screenshots

          # Robot logs
          docker cp uipath-robot:/home/robotuser/.local/share/UiPath/Logs/. ./robot-logs/ || true

          # Screenshots saved in /home/robotuser/screenshots (the "/." copies the folder's contents)
          docker cp uipath-robot:/home/robotuser/screenshots/. ./screenshots/ || true

          # Fallback: any PNGs the robot saved in /tmp
          for f in $(docker exec uipath-robot sh -c 'ls /tmp/*.png 2>/dev/null'); do
            docker cp "uipath-robot:$f" ./screenshots/ || true
          done

          docker stop uipath-robot || true
          docker rm uipath-robot || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-output
          path: |
            robot-logs/
            screenshots/
          if-no-files-found: warn
